<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer's Corner • Blog Post</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap');

    :root {
      --bg-dark: #0829b3;
      --card-bg: rgba(22, 70, 222, 0.9);
      --card-border: rgba(255, 255, 255, 0.2);
      
      --btn-edit: #00e676;
      --btn-edit-hover: #00c853;
      --btn-delete: #ff1744;
      --btn-delete-hover: #d50000;
      --accent-cyan: #00f2fe;
    }

    html {
      scroll-behavior: smooth;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 230, 118, 0.15) 0px, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255, 23, 68, 0.15) 0px, transparent 40%);
    }

    h1, h2, h3, .logo {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Top Header Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 8%;
      background: rgba(8, 35, 155, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    nav {
      display: flex;
      gap: 0.8rem;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.65rem 1.4rem;
      border-radius: 100px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background: #ffffff;
      color: #0829b3;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    /* Main Article Container */
    main {
      flex: 1;
      max-width: 900px;
      width: 90%;
      margin: 3rem auto;
    }

    .article-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 3rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .tag-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      margin-bottom: 1.2rem;
    }

    .article-title {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1.5rem;
      color: #ffffff;
    }

    .article-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 2rem;
      font-size: 0.95rem;
      color: #d1d5db;
    }

    .article-meta strong {
      color: #ffffff;
    }

    .article-content {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #f1f5f9;
      white-space: pre-line;
    }

    .article-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--card-border);
    }

    .btn-edit {
      background: var(--btn-edit);
      color: #000000;
      border: none;
      font-size: 0.9rem;
      font-weight: 800;
      padding: 0.65rem 1.4rem;
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 230, 118, 0.3);
    }

    .btn-edit:hover {
      background: var(--btn-edit-hover);
      transform: translateY(-2px);
    }

    .btn-delete {
      background: var(--btn-delete);
      color: #ffffff;
      border: none;
      font-size: 0.9rem;
      font-weight: 800;
      padding: 0.65rem 1.4rem;
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(255, 23, 68, 0.3);
    }

    .btn-delete:hover {
      background: var(--btn-delete-hover);
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--card-border);
      color: #d1d5db;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <a href="index.html" class="logo">⚡ Latest Blogs</a>
    <nav>
      <a href="index.html" class="nav-btn">← Back to All Blogs</a>
    </nav>
  </header>

  <main>
    <article class="article-container">
      <span class="tag-badge" id="blog-tag">#WEB_DEV</span>
      
      <h1 class="article-title" id="blog-title">Loading Blog Article...</h1>
      
      <div class="article-meta">
        <div>Author: <strong id="blog-author">Loading...</strong></div>
        <div>📅 <span id="blog-date">29 July 2026</span></div>
        <div>⏱️ <span id="blog-readtime">1 min read</span></div>
      </div>

      <div class="article-content" id="blog-content">
        Fetching blog content...
      </div>

      <div class="article-actions">
        <button class="btn-edit" id="btn-edit">✏️ Edit Article</button>
        <button class="btn-delete" id="btn-delete">🗑️ Delete Article</button>
      </div>
    </article>
  </main>

  <footer>
    <p>© 2026 Developer's Corner • Powered by Node.js & Express</p>
  </footer>

  <script>
    // Get Blog ID from URL Query Parameters e.g. blog.html?id=1
    const urlParams = new URLSearchParams(window.location.search);
    const blogId = urlParams.get('id');

    function calculateReadTime(text) {
      const words = text ? text.split(/\s+/).length : 0;
      const minutes = Math.ceil(words / 35);
      return `${minutes} min read`;
    }

    async function loadBlogDetails() {
      if (!blogId) {
        document.getElementById('blog-title').innerText = "Blog Not Found";
        document.getElementById('blog-content').innerText = "Please select a valid blog from the home page.";
        return;
      }

      try {
        const res = await fetch(`/api/blogs/${blogId}`);
        if (!res.ok) throw new Error("Blog not found");

        const blog = await res.json();

        document.getElementById('blog-title').innerText = blog.title;
        document.getElementById('blog-author').innerText = blog.author;
        document.getElementById('blog-content').innerText = blog.description;
        document.getElementById('blog-date').innerText = blog.date || "29 July 2026";
        document.getElementById('blog-readtime').innerText = calculateReadTime(blog.description);

        // Bind delete button
        document.getElementById('btn-delete').onclick = () => deleteBlog(blog.id);
        
        // Bind edit button to redirect back to index with edit intent
        document.getElementById('btn-edit').onclick = () => {
          window.location.href = `index.html?edit=${blog.id}`;
        };

      } catch (err) {
        console.error("Error loading blog:", err);
        document.getElementById('blog-title').innerText = "Error Loading Article";
        document.getElementById('blog-content').innerText = "Could not fetch the requested blog post.";
      }
    }

    async function deleteBlog(id) {
      if (confirm("Are you sure you want to delete this blog post?")) {
        try {
          const res = await fetch(`/api/blogs/${id}`, { method: 'DELETE' });
          if (res.ok) {
            window.location.href = "index.html";
          }
        } catch (err) {
          console.error("Error deleting post:", err);
        }
      }
    }

    window.addEventListener('DOMContentLoaded', loadBlogDetails);
  </script>
</body>
</html>
