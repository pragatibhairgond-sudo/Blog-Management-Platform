<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer's Corner</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #080c14;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* Header Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-link {
      color: #94a3b8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      margin-right: 15px;
      transition: color 0.2s;
    }

    .nav-link:hover { color: #ffffff; }

    .btn-create {
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-create:hover { opacity: 0.9; }

    /* Hero Section */
    .hero {
      text-align: center;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.4));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 45px 20px;
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .hero h1 span {
      background: linear-gradient(90deg, #38bdf8, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .search-wrapper {
      max-width: 520px;
      margin: 0 auto;
      position: relative;
    }

    .search-wrapper input {
      width: 100%;
      padding: 12px 20px 12px 42px;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(15, 23, 42, 0.9);
      color: #ffffff;
      outline: none;
      font-size: 0.9rem;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
    }

    /* Section Header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
    }

    .badge-counter {
      background: #6366f1;
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    /* 3D Blog Grid */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
      perspective: 1000px;
    }

    /* 3D Card Animation & Effects */
    .blog-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.6));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.35s ease, border-color 0.35s ease;
      transform-style: preserve-3d;
      cursor: pointer;
      position: relative;
    }

    .blog-card:hover {
      transform: translateY(-8px) rotateX(4deg) rotateY(-2deg) scale(1.02);
      box-shadow: 0 20px 35px rgba(56, 189, 248, 0.25), 0 0 20px rgba(99, 102, 241, 0.3);
      border-color: rgba(56, 189, 248, 0.6);
    }

    .blog-card.active-3d {
      transform: translateY(-6px) scale(1.03) translateZ(15px);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.6), 0 0 20px rgba(236, 72, 153, 0.5);
      border: 2px solid #38bdf8;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      margin-bottom: 14px;
    }

    .tag-pill {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 10px;
      border-radius: 15px;
      font-weight: 700;
    }

    .author-info { color: #cbd5e1; font-weight: 600; }
    .post-date { color: #64748b; }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .card-desc {
      color: #94a3b8;
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .btn-read, .btn-edit, .btn-delete {
      border: none;
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn-read { background: #38bdf8; color: #0f172a; }
    .btn-edit { background: #6366f1; }
    .btn-delete { background: #f43f5e; }

    .btn-read:hover, .btn-edit:hover, .btn-delete:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    /* Modal Overlay */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 28px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
    }

    .close-x {
      position: absolute;
      top: 18px;
      right: 20px;
      font-size: 1.5rem;
      color: #94a3b8;
      cursor: pointer;
      border: none;
      background: none;
    }

    .close-x:hover { color: #ffffff; }

    .modal-content h2 {
      margin-bottom: 16px;
      font-size: 1.4rem;
      color: #ffffff;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #1e293b;
      color: #ffffff;
      outline: none;
      font-size: 0.9rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-cancel {
      background: #334155;
      color: #cbd5e1;
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-save {
      background: #6366f1;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    /* High Readability / Zoomed Article View */
    .read-article-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-top: 10px;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    .read-article-body {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 22px;
      color: #f8fafc;
      font-size: 1.15rem;
      line-height: 1.8;
      white-space: pre-wrap;
      margin-bottom: 20px;
      word-break: break-word;
    }

    footer {
      text-align: center;
      margin-top: auto;
      padding: 20px 0;
      color: #64748b;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo">⚡ Developer's Corner</div>
      <nav>
        <a href="index.html" class="nav-link">Home</a>
        <button class="btn-create" onclick="openCreateModal()">+ Create Post</button>
      </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
      <h1>Welcome to My <span>Tech Blog</span></h1>
      <p>Discover articles on Web Development, Design, and Technology.</p>
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search blogs by title, author, or category...">
      </div>
    </section>

    <!-- Content Area -->
    <main>
      <div class="section-header">
        <h2 class="section-title">Recent Blog Posts</h2>
        <div class="badge-counter">Total Articles: <span id="total-count">0</span></div>
      </div>
      <div id="blog-grid" class="blog-grid"></div>
    </main>

    <!-- Footer -->
    <footer>
      <p>© 2026 Developer's Corner • Powered by Node.js & Express</p>
    </footer>
  </div>

  <!-- Modal Popup for Create / Edit -->
  <div id="blog-modal" class="modal">
    <div class="modal-content">
      <button class="close-x" onclick="closeModal()">&times;</button>
      <h2 id="modal-title">Create New Post</h2>
      <form id="blog-form">
        <input type="hidden" id="edit-id">
        <div class="form-group">
          <input type="text" id="form-title" placeholder="Article Title" required>
          <input type="text" id="form-author" placeholder="Author Name (e.g. Alex Rivera)" required>
          <input type="text" id="form-tag" placeholder="Category Tag (e.g. #AI_ML)" required>
          <textarea id="form-desc" placeholder="Write description here..." rows="4" required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-save">Publish Post</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Zoom Read Article Modal -->
  <div id="read-modal" class="modal">
    <div class="modal-content">
      <button class="close-x" onclick="closeReadModal()">&times;</button>
      <div class="card-meta">
        <span id="read-tag" class="tag-pill">#Category</span>
        <span id="read-author" class="author-info">✍️ Author</span>
        <span id="read-date" class="post-date">2026-08-08</span>
      </div>
      <h2 id="read-title" class="read-article-title">Article Title</h2>
      <div id="read-desc" class="read-article-body">Full article text...</div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeReadModal()">Close Article</button>
      </div>
    </div>
  </div>

  <script>
    const defaultArticles = [
      {
        id: 1,
        title: "How AI is changing web development in 2026",
        author: "Alex Rivera",
        date: "2026-07-24",
        tag: "#AI_ML",
        description: "AI tools are no longer optional for developers. From automated code completion to intelligent API design, AI is speeding up full-stack workflows. Developers leverage modern LLMs to write unit tests, generate CSS styles, and automate repetitive backend logic."
      },
      {
        id: 2,
        title: "Mastering CSS Grid and Modern Layouts",
        author: "Sarah Chen",
        date: "2026-07-30",
        tag: "#CSS_Design",
        description: "Designing responsive layouts has never been easier. Combining CSS Flexbox for 1D alignments and CSS Grid for 2D structures gives you complete creative control. Harness fractional units, auto-fit repeaters, and modern 3D transforms to elevate web experiences."
      },
      {
        id: 3,
        title: "Building RESTful APIs with Express.js",
        author: "David Kim",
        date: "2026-07-31",
        tag: "#Technology",
        description: "Express.js simplifies route handling and request management in Node.js. By connecting REST APIs to frontend Fetch calls, you create seamless experiences. Learn middleware architecture, token authentication, and clean error handling."
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      initApp();
    });

    function getArticles() {
      try {
        const data = localStorage.getItem("my_tech_blog_posts");
        return data ? JSON.parse(data) : defaultArticles;
      } catch (e) {
        return defaultArticles;
      }
    }

    function saveArticles(data) {
      localStorage.setItem("my_tech_blog_posts", JSON.stringify(data));
    }

    function initApp() {
      if (!localStorage.getItem("my_tech_blog_posts")) {
        saveArticles(defaultArticles);
      }

      render(getArticles());

      // Search functionality
      document.getElementById('search-input').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const articles = getArticles();
        const filtered = articles.filter(item => 
          item.title.toLowerCase().includes(query) ||
          item.author.toLowerCase().includes(query) ||
          item.tag.toLowerCase().includes(query) ||
          item.description.toLowerCase().includes(query)
        );
        render(filtered);
      });

      // Form submission (Create or Edit)
      document.getElementById('blog-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const editId = document.getElementById('edit-id').value;
        const title = document.getElementById('form-title').value.trim();
        const author = document.getElementById('form-author').value.trim();
        let tag = document.getElementById('form-tag').value.trim();
        const description = document.getElementById('form-desc').value.trim();

        if (!tag.startsWith('#')) tag = '#' + tag;

        let articles = getArticles();

        if (editId) {
          articles = articles.map(item => item.id == editId ? {
            ...item, title, author, tag, description
          } : item);
        } else {
          const today = new Date().toISOString().split('T')[0];
          articles.unshift({
            id: Date.now(),
            title,
            author,
            date: today,
            tag,
            description
          });
        }

        saveArticles(articles);
        render(articles);
        closeModal();
      });
    }

    function render(list) {
      const container = document.getElementById('blog-grid');
      const countElem = document.getElementById('total-count');

      if (countElem) countElem.textContent = list.length;
      if (!container) return;

      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<p style="color: #64748b; grid-column: 1/-1; text-align: center;">No articles match your search.</p>';
        return;
      }

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'blog-card';

        // Toggle 3D highlight outline when clicking the card body
        card.onclick = (e) => {
          if (!e.target.closest('button')) {
            document.querySelectorAll('.blog-card').forEach(c => c.classList.remove('active-3d'));
            card.classList.add('active-3d');
          }
        };

        card.innerHTML = `
          <div>
            <div class="card-meta">
              <span class="tag-pill">${item.tag}</span>
              <span class="author-info">✍️ ${item.author}</span>
              <span class="post-date">${item.date}</span>
            </div>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-desc">${item.description}</p>
          </div>
          <div class="card-actions">
            <button class="btn-read" onclick="openReadModal(event, ${item.id})">🔍 Read</button>
            <button class="btn-edit" onclick="openEditModal(event, ${item.id})">✏️ Edit</button>
            <button class="btn-delete" onclick="deleteArticle(event, ${item.id})">🗑️ Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openReadModal(event, id) {
      if (event) event.stopPropagation();
      const item = getArticles().find(a => a.id == id);
      if (!item) return;

      document.getElementById('read-tag').textContent = item.tag;
      document.getElementById('read-author').textContent = `✍️ ${item.author}`;
      document.getElementById('read-date').textContent = item.date;
      document.getElementById('read-title').textContent = item.title;
      document.getElementById('read-desc').textContent = item.description;

      document.getElementById('read-modal').style.display = 'flex';
    }

    function closeReadModal() {
      document.getElementById('read-modal').style.display = 'none';
    }

    function deleteArticle(event, id) {
      if (event) event.stopPropagation();
      let articles = getArticles().filter(item => item.id != id);
      saveArticles(articles);
      render(articles);
    }

    function openCreateModal() {
      document.getElementById('blog-form').reset();
      document.getElementById('edit-id').value = '';
      document.getElementById('modal-title').textContent = 'Create New Post';
      document.getElementById('blog-modal').style.display = 'flex';
    }

    function openEditModal(event, id) {
      if (event) event.stopPropagation();
      const item = getArticles().find(a => a.id == id);
      if (!item) return;

      document.getElementById('edit-id').value = item.id;
      document.getElementById('form-title').value = item.title;
      document.getElementById('form-author').value = item.author;
      document.getElementById('form-tag').value = item.tag;
      document.getElementById('form-desc').value = item.description;

      document.getElementById('modal-title').textContent = 'Edit Post';
      document.getElementById('blog-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('blog-modal').style.display = 'none';
    }
  </script>
</body>
</html>
