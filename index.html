<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer's Corner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      padding: 20px;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .hero {
      text-align: center;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 20px;
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .hero h1 span {
      background: linear-gradient(90deg, #38bdf8, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      max-width: 500px;
      margin: 0 auto;
    }

    .search-bar input {
      flex: 1;
      padding: 10px 18px;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(15, 23, 42, 0.8);
      color: #ffffff;
      outline: none;
    }

    .badge {
      background: #6366f1;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }

    main h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    /* CSS Grid Layout - Expands to fill full screen width */
    .horizontal-showcase {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      width: 100%;
    }

    .showcase-card {
      width: 100%;
      max-width: 100%;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .tag-pill {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .btn-edit, .btn-delete {
      border: none;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
    }

    .btn-edit { background: #6366f1; }
    .btn-delete { background: #f43f5e; }

    .card-title {
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      margin: 10px 0;
    }

    .card-desc {
      color: #94a3b8;
      font-size: 0.85rem;
      line-height: 1.45;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: #64748b;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ Developer's Corner</div>
  </header>

  <section class="hero">
    <h1>Welcome to <span>Developer's Corner</span></h1>
    <p>Discover insightful articles, tutorials, and tips on modern full-stack engineering.</p>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search articles by title...">
      <div class="badge">Total Articles: <span id="total-articles">0</span></div>
    </div>
  </section>

  <main>
    <h2>🔥 Horizontal Article Showcase</h2>
    <div id="blog-list" class="horizontal-showcase"></div>
  </main>

  <footer>
    <p>© 2026 Developer's Corner • Powered by Node.js & Express</p>
  </footer>

  <script>
    const defaultData = [
      {
        id: 1,
        title: "Getting Started with Modern JavaScript",
        category: "#AI_ML",
        description: "Learn the essential fundamentals of modern JavaScript, including arrow functions, DOM manipulation, and modern ES6 features."
      },
      {
        id: 2,
        title: "Building RESTful APIs with Node.js & Express",
        category: "#Cloud_DevOps",
        description: "A comprehensive beginner-friendly guide to setting up route handlers, middleware, and handling JSON data in Express."
      },
      {
        id: 3,
        title: "Deploying Web Applications to GitHub Pages",
        category: "#Web_Dev",
        description: "Discover how to configure repository settings, resolve missing static assets, and deploy responsive web projects seamlessly."
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      initApp();
    });

    function initApp() {
      let stored = localStorage.getItem("my_blog_posts");
      let blogs = stored ? JSON.parse(stored) : defaultData;

      if (!stored || blogs.length === 0) {
        localStorage.setItem("my_blog_posts", JSON.stringify(defaultData));
        blogs = defaultData;
      }

      render(blogs);

      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const q = e.target.value.toLowerCase();
          const filtered = blogs.filter(b => 
            b.title.toLowerCase().includes(q) || b.description.toLowerCase().includes(q)
          );
          render(filtered);
        });
      }
    }

    function render(list) {
      const container = document.getElementById('blog-list');
      const totalElem = document.getElementById('total-articles');

      if (totalElem) totalElem.textContent = list.length;
      if (!container) return;

      container.innerHTML = '';

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'showcase-card';
        card.innerHTML = `
          <div class="card-header">
            <span class="tag-pill">${item.category}</span>
            <div class="card-actions">
              <button class="btn-edit">✏️ Edit</button>
              <button class="btn-delete" onclick="removePost(${item.id})">🗑️ Delete</button>
            </div>
          </div>
          <h3 class="card-title">${item.title}</h3>
          <p class="card-desc">${item.description}</p>
        `;
        container.appendChild(card);
      });
    }

    function removePost(id) {
      let current = JSON.parse(localStorage.getItem("my_blog_posts")) || defaultData;
      current = current.filter(b => b.id !== id);
      localStorage.setItem("my_blog_posts", JSON.stringify(current));
      render(current);
    }
  </script>
</body>
</html>
