<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Management System - Home</title>
  <!-- Google Font: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #2c3e50;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Header Navigation */
    header {
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #2c3e50;
    }

    .logo span {
      color: #2563eb;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-link {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .btn-create {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s ease;
    }

    .btn-create:hover {
      background-color: #1d4ed8;
    }

    /* Hero Banner */
    .hero {
      background: linear-gradient(135deg, #1e3a8a, #2563eb, #3b82f6);
      color: #ffffff;
      border-radius: 12px;
      padding: 36px 20px;
      text-align: center;
      margin: 20px 0;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .hero h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .hero p {
      font-size: 0.88rem;
      opacity: 0.92;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Search Bar */
    .search-container {
      margin-bottom: 24px;
      position: relative;
    }

    .search-input-wrapper {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 25px;
      padding: 10px 18px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .search-icon {
      margin-right: 10px;
      font-size: 1.1rem;
      color: #94a3b8;
    }

    .search-input-wrapper input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 0.9rem;
      color: #2c3e50;
      background: transparent;
    }

    .search-input-wrapper input::placeholder {
      color: #94a3b8;
    }

    /* Main Section */
    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 16px;
    }

    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding-bottom: 30px;
    }

    .blog-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .tag {
      background: #eff6ff;
      color: #2563eb;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .actions button {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 0.8rem;
      margin-left: 6px;
    }

    .btn-delete { color: #ef4444; }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #64748b;
      line-height: 1.45;
    }

    /* Modal Popup */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(3px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .modal-content h3 {
      margin-bottom: 16px;
      color: #1e293b;
    }

    .modal-content input, .modal-content textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      margin-bottom: 12px;
      outline: none;
      font-size: 0.9rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-cancel {
      background: #e2e8f0;
      color: #475569;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-submit {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="nav-wrapper">
      <div class="logo">MyBlog<span>App</span></div>
      <nav>
        <a href="index.html" class="nav-link">Home</a>
        <button class="btn-create" onclick="openModal()">+ Create Post</button>
      </nav>
    </div>
  </header>

  <div class="container">
    <!-- Hero Banner -->
    <section class="hero">
      <h1>Welcome to My Blog Space</h1>
      <p>Discover articles on Web Development, Design, and Technology.</p>
    </section>

    <!-- Search Input -->
    <div class="search-container">
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search blogs by title, author, or category...">
      </div>
    </div>

    <!-- Recent Blog Posts Section -->
    <main>
      <h2 class="section-title">Recent Blog Posts</h2>
      <div id="blog-list" class="blog-grid"></div>
    </main>
  </div>

  <!-- Create Post Modal -->
  <div id="create-modal" class="modal">
    <div class="modal-content">
      <h3>Create New Post</h3>
      <form id="post-form">
        <input type="text" id="post-title" placeholder="Blog Title" required>
        <input type="text" id="post-tag" placeholder="Category Tag (e.g. #WebDev)" required>
        <textarea id="post-desc" placeholder="Write your content..." rows="4" required></textarea>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-submit">Publish</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript for Rendering & Storage -->
  <script>
    const defaultPosts = [
      {
        id: 1,
        title: "Getting Started with Web Development",
        tag: "#WebDev",
        description: "Learn HTML, CSS, and JavaScript fundamentals to build modern interactive websites."
      },
      {
        id: 2,
        title: "Mastering Responsive UI Design",
        tag: "#Design",
        description: "Explore essential grid and flexbox layouts to ensure your app looks great on all screen sizes."
      },
      {
        id: 3,
        title: "Modern Full-Stack Technology Trends",
        tag: "#Technology",
        description: "An overview of contemporary frameworks, cloud deployment, and API integrations."
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      loadPosts();

      document.getElementById('search-input').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const stored = getStoredPosts();
        const filtered = stored.filter(p => 
          p.title.toLowerCase().includes(query) || 
          p.tag.toLowerCase().includes(query) ||
          p.description.toLowerCase().includes(query)
        );
        renderPosts(filtered);
      });

      document.getElementById('post-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const title = document.getElementById('post-title').value.trim();
        let tag = document.getElementById('post-tag').value.trim();
        const description = document.getElementById('post-desc').value.trim();

        if (!tag.startsWith('#')) tag = '#' + tag;

        const current = getStoredPosts();
        current.unshift({ id: Date.now(), title, tag, description });
        localStorage.setItem("my_blog_space_data", JSON.stringify(current));

        renderPosts(current);
        closeModal();
        e.target.reset();
      });
    });

    function getStoredPosts() {
      try {
        const stored = localStorage.getItem("my_blog_space_data");
        return stored ? JSON.parse(stored) : defaultPosts;
      } catch (e) {
        return defaultPosts;
      }
    }

    function loadPosts() {
      let posts = getStoredPosts();
      if (!localStorage.getItem("my_blog_space_data")) {
        localStorage.setItem("my_blog_space_data", JSON.stringify(defaultPosts));
      }
      renderPosts(posts);
    }

    function renderPosts(list) {
      const container = document.getElementById('blog-list');
      if (!container) return;
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<p style="color: #94a3b8; grid-column: 1/-1;">No matching blog posts found.</p>';
        return;
      }

      list.forEach(post => {
        const card = document.createElement('div');
        card.className = 'blog-card';
        card.innerHTML = `
          <div>
            <div class="card-meta">
              <span class="tag">${post.tag || '#General'}</span>
              <div class="actions">
                <button class="btn-delete" onclick="deletePost(${post.id})">🗑️ Delete</button>
              </div>
            </div>
            <h3 class="card-title">${post.title}</h3>
            <p class="card-desc">${post.description}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function deletePost(id) {
      let posts = getStoredPosts().filter(p => p.id !== id);
      localStorage.setItem("my_blog_space_data", JSON.stringify(posts));
      renderPosts(posts);
    }

    function openModal() {
      document.getElementById('create-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('create-modal').style.display = 'none';
    }
  </script>
</body>
</html>
