<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer's Corner</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="public/style.css">
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <div class="logo">⚡ Developer's Corner</div>
    <nav>
      <a href="index.html" class="nav-btn active">Home</a>
      <a href="blog.html" class="nav-btn">Add Blog</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Welcome to <span>Developer's Corner</span></h1>
    <p>Discover insightful articles, tutorials, and tips on modern full-stack engineering.</p>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search articles by title...">
      <div class="badge">Total Articles: <span id="total-articles">3</span></div>
    </div>
  </section>

  <!-- Article Showcase Section -->
  <main>
    <h2>🔥 Horizontal Article Showcase</h2>
    <div id="blog-list" class="horizontal-showcase">
      <!-- Articles will be rendered here by script.js -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2026 Developer's Corner • Powered by Node.js & Express</p>
  </footer>

  <script src="script.js"></script>
  <script src="public/script.js"></script>
</body>
</html>
