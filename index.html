<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer's Corner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      padding: 0;
      margin: 0;
      min-height: 100vh;
    }

    /* Top Navigation Header matching reference layout */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-btn:hover, .nav-btn.active {
      color: #ffffff;
    }

    .btn-create-nav {
      background: #6366f1;
      color: #ffffff;
      padding: 9px 22px;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-create-nav:hover {
      background: #4f46e5;
      transform: translateY(-1px);
    }

    /* Hero Section matching reference style */
    .hero {
      text-align: center;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.95));
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 50px 20px 45px;
    }

    .hero h1 {
      font-size: 2.3rem;
      font-weight: 800;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .hero h1 span {
      background: linear-gradient(90deg, #38bdf8, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    /* Floating Search Bar matching reference placement */
    .search-wrapper {
      display: flex;
      justify-content: center;
      margin-top: -24px;
      margin-bottom: 35px;
      padding: 0 20px;
    }

    .search-bar {
      position: relative;
      width: 100%;
      max-width: 580px;
    }

    .search-bar input {
      width: 100%;
      padding: 12px 20px 12px 48px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .search-bar input:focus {
      border-color: #38bdf8;
    }

    .search-bar .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
    }

    /* Main Container */
    .app-container {
      max-width: 1350px;
      margin: 0 auto;
      padding: 0 25px 40px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
    }

    .badge {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Blog Grid Layout */
    .horizontal-showcase {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 28px;
      width: 100%;
    }

    .showcase-card {
      width: 100%;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s, border-color 0.2s;
    }

    .showcase-card:hover {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tag-pill {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .post-date {
      color: #64748b;
      font-size: 0.78rem;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .btn-edit, .btn-delete {
      border: none;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
    }

    .btn-edit { background: #6366f1; }
    .btn-delete { background: #f43f5e; }

    .card-title {
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      margin: 10px 0 8px;
      line-height: 1.4;
    }

    .card-desc {
      color: #94a3b8;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    /* Modal Popup Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .modal-content h3 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(30, 41, 59, 0.6);
      color: #ffffff;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8;
      padding: 8px 18px;
      border-radius: 12px;
      cursor: pointer;
    }

    .btn-submit {
      background: #6366f1;
      border: none;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    footer {
      text-align: center;
      margin-top: 60px;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="logo">⚡ Developer's Corner</div>
    <nav class="nav-links">
      <a href="index.html" class="nav-btn active">Home</a>
      <button class="btn-create-nav" onclick="toggleModal(true)">+ Create Post</button>
    </nav>
  </header>

  <!-- Hero Banner -->
  <section class="hero">
    <h1>Welcome to <span>Developer's Corner</span></h1>
    <p>Discover articles on Web Development, Design, and Technology.</p>
  </section>

  <!-- Centered Floating Search Bar -->
  <div class="search-wrapper">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search blogs by title, category, or description...">
    </div>
  </div>

  <div class="app-container">
    <!-- Section Header with Total Badge -->
    <div class="section-header">
      <h2 class="section-title">Recent Blog Posts</h2>
      <div class="badge">Total Articles: <span id="total-articles">0</span></div>
    </div>

    <!-- Blog Grid Showcase -->
    <main>
      <div id="blog-list" class="horizontal-showcase"></div>
    </main>

    <footer>
      <p>© 2026 Developer's Corner • Powered by Node.js & Express</p>
    </footer>
  </div>

  <!-- Create Post Modal Popup -->
  <div id="create-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>Create New Article</h3>
      <div class="form-group">
        <label>Article Title</label>
        <input type="text" id="post-title" placeholder="e.g. Mastering CSS Grid and Modern Layouts">
      </div>
      <div class="form-group">
        <label>Category Tag</label>
        <input type="text" id="post-category" placeholder="e.g. #Web_Dev or #AI_ML">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="post-desc" rows="4" placeholder="Write a short summary..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="toggleModal(false)">Cancel</button>
        <button class="btn-submit" onclick="createNewPost()">Publish Article</button>
      </div>
    </div>
  </div>

  <script>
    const defaultArticles = [
      {
        id: 1,
        title: "How AI is changing web development in 2026",
        category: "#AI_ML",
        date: "2026-07-24",
        description: "AI tools are no longer optional for developers. From automated code completion to intelligent API design, AI is speeding up full-stack workflows."
      },
      {
        id: 2,
        title: "Mastering CSS Grid and Modern Layouts",
        category: "#CSS_Design",
        date: "2026-07-30",
        description: "Designing responsive layouts has never been easier. Combining CSS Flexbox for 1D alignments and CSS Grid for 2D structures gives complete creative control."
      },
      {
        id: 3,
        title: "Building RESTful APIs with Express.js",
        category: "#Technology",
        date: "2026-07-31",
        description: "Express.js simplifies route handling and request management in Node.js. By connecting REST APIs to frontend Fetch calls, you create seamless experiences."
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      initApp();
    });

    function initApp() {
      let stored = localStorage.getItem("my_blog_posts");
      let blogs = stored ? JSON.parse(stored) : defaultArticles;

      if (!stored || blogs.length === 0) {
        localStorage.setItem("my_blog_posts", JSON.stringify(defaultArticles));
        blogs = defaultArticles;
      }

      render(blogs);

      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const query = e.target.value.toLowerCase();
          const filtered = blogs.filter(b => 
            b.title.toLowerCase().includes(query) || 
            b.description.toLowerCase().includes(query) ||
            (b.category && b.category.toLowerCase().includes(query))
          );
          render(filtered);
        });
      }
    }

    function render(list) {
      const container = document.getElementById('blog-list');
      const totalElem = document.getElementById('total-articles');

      if (totalElem) totalElem.textContent = list.length;
      if (!container) return;

      container.innerHTML = '';

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'showcase-card';
        card.innerHTML = `
          <div class="card-header">
            <div class="card-meta">
              <span class="tag-pill">${item.category || '#Dev'}</span>
              <span class="post-date">${item.date || '2026-08-07'}</span>
            </div>
            <div class="card-actions">
              <button class="btn-edit">✏️ Edit</button>
              <button class="btn-delete" onclick="removePost(${item.id})">🗑️ Delete</button>
            </div>
          </div>
          <h3 class="card-title">${item.title}</h3>
          <p class="card-desc">${item.description}</p>
        `;
        container.appendChild(card);
      });
    }

    function removePost(id) {
      let current = JSON.parse(localStorage.getItem("my_blog_posts")) || defaultArticles;
      current = current.filter(b => b.id !== id);
      localStorage.setItem("my_blog_posts", JSON.stringify(current));
      render(current);
    }

    function toggleModal(show) {
      document.getElementById('create-modal').style.display = show ? 'flex' : 'none';
    }

    function createNewPost() {
      const title = document.getElementById('post-title').value.trim();
      const category = document.getElementById('post-category').value.trim();
      const description = document.getElementById('post-desc').value.trim();

      if (!title || !description) {
        alert("Please enter a title and description.");
        return;
      }

      const today = new Date().toISOString().split('T')[0];
      let current = JSON.parse(localStorage.getItem("my_blog_posts")) || defaultArticles;
      
      const newPost = {
        id: Date.now(),
        title: title,
        category: category.startsWith('#') ? category : `#${category || 'Dev'}`,
        date: today,
        description: description
      };

      current.unshift(newPost);
      localStorage.setItem("my_blog_posts", JSON.stringify(current));
      
      document.getElementById('post-title').value = '';
      document.getElementById('post-category').value = '';
      document.getElementById('post-desc').value = '';
      toggleModal(false);

      render(current);
    }
  </script>
</body>
</html>
