<script>
    let allBlogs = [];

    // Fallback articles for static hosts like GitHub Pages
    const fallbackArticles = [
      {
        id: 1,
        title: "Getting Started with Modern JavaScript",
        author: "Aarti Kamble",
        description: "Learn the essential fundamentals of modern JavaScript, including arrow functions, DOM manipulation, and modern ES6 features.",
        date: "Aug 4, 2026"
      },
      {
        id: 2,
        title: "Building RESTful APIs with Node.js & Express",
        author: "Tech Explorer",
        description: "A comprehensive beginner-friendly guide to setting up route handlers, middleware, and handling JSON data in Express.",
        date: "Aug 5, 2026"
      },
      {
        id: 3,
        title: "Deploying Web Applications to GitHub Pages",
        author: "Frontend Dev",
        description: "Discover how to configure repository settings, resolve missing static assets, and deploy responsive web projects seamlessly.",
        date: "Aug 6, 2026"
      }
    ];

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');

      if (tabId === 'home') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        fetchBlogs();
      } else {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
      }
    }

    async function fetchBlogs() {
      try {
        const res = await fetch('/api/blogs');
        if (res.ok) {
          allBlogs = await res.json();
        } else {
          throw new Error("Express route not available");
        }
      } catch (err) {
        console.warn("Backend API unavailable. Loading static fallback articles for GitHub Pages.");
        if (allBlogs.length === 0) {
          allBlogs = [...fallbackArticles];
        }
      }
      renderBlogs(allBlogs);
    }

    function calculateReadTime(text) {
      const words = text ? text.split(/\s+/).length : 0;
      const minutes = Math.ceil(words / 35);
      return `${minutes} min read`;
    }

    function renderBlogs(blogs) {
      const grid = document.getElementById('recent-blogs-grid');
      const totalCountElem = document.getElementById('total-count');

      if (totalCountElem) {
        totalCountElem.innerText = blogs.length;
      }

      if (!grid) return;

      if (blogs.length === 0) {
        grid.innerHTML = `<p style="color:#64748b; padding:1rem;">No articles found matching your query.</p>`;
        return;
      }

      const tags = ['#AI_ML', '#Cloud_DevOps', '#Web_Dev', '#Rust_Lang', '#FullStack'];

      grid.innerHTML = blogs.map((blog, idx) => `
        <div class="stream-card" onclick="openZoomModal(${blog.id})">
          <div>
            <div class="card-top-bar">
              <span class="tag-badge">${tags[idx % tags.length]}</span>
              <div class="card-actions" onclick="event.stopPropagation()">
                <button class="btn-edit" onclick="openEditModal(${blog.id})">✏️ Edit</button>
                <button class="btn-delete" onclick="deleteBlog(${blog.id})">🗑️ Delete</button>
              </div>
            </div>
            <h3>${blog.title}</h3>
            <p>${blog.description}</p>
          </div>
          <div>
            <div class="card-meta">
              <span>⏱️ ${calculateReadTime(blog.description)}</span>
              <button class="btn-zoom" onclick="event.stopPropagation(); openZoomModal(${blog.id})">🔎 Read Blog</button>
            </div>
            <div class="card-footer">
              <span>By <strong>${blog.author}</strong></span>
              <span>📅 ${blog.date || 'Aug 4, 2026'}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openZoomModal(id) {
      const blog = allBlogs.find(b => Number(b.id) === Number(id));
      if (!blog) return;

      document.getElementById('zoom-title').innerText = blog.title;
      document.getElementById('zoom-author').innerText = blog.author;
      document.getElementById('zoom-desc').innerText = blog.description;
      document.getElementById('zoom-date').innerText = `📅 ${blog.date || 'Aug 4, 2026'}`;
      document.getElementById('zoom-readtime').innerText = `⏱️ ${calculateReadTime(blog.description)}`;

      document.getElementById('zoom-modal').classList.add('active');
    }

    function closeZoomModal(e) {
      document.getElementById('zoom-modal').classList.remove('active');
    }

    function updateLivePreview() {
      const t = document.getElementById('title').value;
      const a = document.getElementById('author').value;
      const d = document.getElementById('description').value;

      document.getElementById('preview-title').innerText = t || "Article Title Preview";
      document.getElementById('preview-author').innerText = a || "Author Name";
      document.getElementById('preview-desc').innerText = d || "Article content will dynamically appear here as you type in the editor on the left pane...";
      document.getElementById('preview-readtime').innerText = `⏱️ ${calculateReadTime(d)}`;
    }

    async function deleteBlog(id) {
      if (confirm("Are you sure you want to delete this post?")) {
        try {
          await fetch(`/api/blogs/${id}`, { method: 'DELETE' });
        } catch (err) {
          console.warn("Express backend unavailable, deleting locally.");
        }
        allBlogs = allBlogs.filter(b => Number(b.id) !== Number(id));
        renderBlogs(allBlogs);
      }
    }

    function openEditModal(id) {
      const blog = allBlogs.find(b => Number(b.id) === Number(id));
      if (!blog) return;

      document.getElementById('edit-id').value = blog.id;
      document.getElementById('edit-title').value = blog.title;
      document.getElementById('edit-author').value = blog.author;
      document.getElementById('edit-description').value = blog.description;

      document.getElementById('edit-modal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('active');
    }

    document.getElementById('edit-blog-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('edit-id').value;
      const title = document.getElementById('edit-title').value;
      const author = document.getElementById('edit-author').value;
      const description = document.getElementById('edit-description').value;

      try {
        await fetch(`/api/blogs/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, author, description })
        });
      } catch (err) {
        console.warn("Express backend unavailable, updating locally.");
      }

      const index = allBlogs.findIndex(b => Number(b.id) === Number(id));
      if (index !== -1) {
        allBlogs[index] = { ...allBlogs[index], title, author, description };
      }

      closeEditModal();
      renderBlogs(allBlogs);
    });

    function filterBlogs() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allBlogs.filter(blog => 
        blog.title.toLowerCase().includes(query) || 
        blog.description.toLowerCase().includes(query)
      );
      renderBlogs(filtered);
    }

    document.getElementById('add-blog-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = document.getElementById('title').value;
      const author = document.getElementById('author').value;
      const description = document.getElementById('description').value;
      const newBlog = { id: Date.now(), title, author, description, date: 'Aug 7, 2026' };

      try {
        await fetch('/api/blogs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, author, description })
        });
      } catch (err) {
        console.warn("Express backend unavailable, publishing locally.");
      }

      allBlogs.unshift(newBlog);
      document.getElementById('add-blog-form').reset();
      updateLivePreview();
      
      switchTab('home');
      renderBlogs(allBlogs);
      
      setTimeout(() => {
        const stream = document.getElementById('recent-blogs-grid');
        if (stream) stream.scrollTo({ left: 0, behavior: 'smooth' });
      }, 200);
    });

    window.addEventListener('DOMContentLoaded', fetchBlogs);
  </script>
