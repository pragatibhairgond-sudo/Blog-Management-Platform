<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer's Corner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      padding: 20px;
      min-height: 100vh;
    }

    /* Header Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      margin-bottom: 28px;
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    nav {
      display: flex;
      gap: 12px;
    }

    .nav-btn {
      color: #94a3b8;
      background: transparent;
      border: 1px solid transparent;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn.active, .nav-btn:hover {
      background: #6366f1;
      color: #ffffff;
      border-color: #6366f1;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 20px;
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .hero h1 span {
      background: linear-gradient(90deg, #38bdf8, #ec4899);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      max-width: 500px;
      margin: 0 auto;
    }

    .search-bar input {
      flex: 1;
      padding: 10px 18px;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(15, 23, 42, 0.8);
      color: #ffffff;
      outline: none;
    }

    .badge {
      background: #6366f1;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Showcase Section */
    main h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .horizontal-showcase {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding-bottom: 20px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .showcase-card {
      min-width: 300px;
      max-width: 330px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      scroll-snap-align: start;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .tag-pill {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .btn-edit, .btn-delete {
      border: none;
      padding: 6px 12px;
      min-height: 36px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
    }

    .btn-edit { background: #6366f1; }
    .btn-delete { background: #f43f5e; }

    .card-title {
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      margin: 10px 0;
    }

    .card-desc {
      color: #94a3b8;
      font-size: 0.85rem;
      line-height: 1.45;
    }

    /* Empty Search State UI */
    .empty-state {
      width: 100%;
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
      font-size: 1rem;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
    }

    /* Modal Popup */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 25px;
      width: 90%;
      max-width: 450px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px; right: 20px;
      font-size: 1.5rem;
      color: #94a3b8;
      cursor: pointer;
    }

    .modal-content h2 {
      margin-bottom: 20px;
      color: #fff;
      font-size: 1.3rem;
    }

    .modal-content form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-content input, .modal-content textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #1e293b;
      color: #fff;
      outline: none;
    }

    .submit-btn {
      background: #6366f1;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: #64748b;
      font-size: 0.82rem;
    }

    /* Mobile Responsive Viewport Fix */
    @media (max-width: 600px) {
      .search-bar { flex-direction: column; }
      .search-bar input { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="logo">⚡ Developer's Corner</div>
    <nav>
      <a href="index.html" class="nav-btn active">Home</a>
      <button class="nav-btn" onclick="openAddModal()">Add Blog</button>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Welcome to <span>Developer's Corner</span></h1>
    <p>Discover insightful articles, tutorials, and tips on modern full-stack engineering.</p>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search articles by title...">
      <div class="badge">Total Articles: <span id="total-articles">0</span></div>
    </div>
  </section>

  <!-- Content Section -->
  <main>
    <h2>🔥 Horizontal Article Showcase</h2>
    <div id="blog-list" class="horizontal-showcase"></div>
  </main>

  <!-- Add Blog Modal -->
  <div id="add-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeAddModal()">&times;</span>
      <h2>✏️ Add New Article</h2>
      <form id="add-blog-form">
        <input type="text" id="new-title" placeholder="Article Title" required>
        <input type="text" id="new-category" placeholder="Category Tag (e.g. #Web_Dev)" required>
        <textarea id="new-desc" placeholder="Article Description..." rows="4" required></textarea>
        <button type="submit" class="submit-btn">Publish Article</button>
      </form>
    </div>
  </div>

  <footer>
    <p>© 2026 Developer's Corner • Powered by Node.js & Express</p>
  </footer>

  <script>
    const defaultData = [
      {
        id: 1,
        title: "Getting Started with Modern JavaScript",
        category: "#AI_ML",
        description: "Learn the essential fundamentals of modern JavaScript, including arrow functions, DOM manipulation, and modern ES6 features."
      },
      {
        id: 2,
        title: "Building RESTful APIs with Node.js & Express",
        category: "#Cloud_DevOps",
        description: "A comprehensive beginner-friendly guide to setting up route handlers, middleware, and handling JSON data in Express."
      },
      {
        id: 3,
        title: "Deploying Web Applications to GitHub Pages",
        category: "#Web_Dev",
        description: "Discover how to configure repository settings, resolve missing static assets, and deploy responsive web projects seamlessly."
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      initApp();
    });

    // Storage Error Handler (Prevents crashes if localStorage is corrupted)
    function getSafeStorage() {
      try {
        const stored = localStorage.getItem("my_blog_posts");
        return stored ? JSON.parse(stored) : defaultData;
      } catch (e) {
        return defaultData;
      }
    }

    function initApp() {
      let blogs = getSafeStorage();

      if (!localStorage.getItem("my_blog_posts") || blogs.length === 0) {
        localStorage.setItem("my_blog_posts", JSON.stringify(defaultData));
        blogs = defaultData;
      }

      render(blogs);

      // Debounced Search Input
      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', debounce((e) => {
          const q = e.target.value.trim().toLowerCase();
          const currentData = getSafeStorage();
          const filtered = currentData.filter(b => 
            b.title.toLowerCase().includes(q) || b.description.toLowerCase().includes(q)
          );
          render(filtered);
        }, 250));
      }

      // Add Blog Form Handler with Input Trimming
      const form = document.getElementById('add-blog-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const title = document.getElementById('new-title').value.trim();
          let category = document.getElementById('new-category').value.trim();
          const description = document.getElementById('new-desc').value.trim();

          if (!title || !description || !category) return; // Prevent empty posts

          if (!category.startsWith('#')) category = '#' + category;

          const current = getSafeStorage();
          const newPost = { id: Date.now(), title, category, description };

          current.unshift(newPost);
          localStorage.setItem("my_blog_posts", JSON.stringify(current));

          render(current);
          form.reset();
          closeAddModal();
        });
      }
    }

    function render(list) {
      const container = document.getElementById('blog-list');
      const totalElem = document.getElementById('total-articles');

      if (totalElem) totalElem.textContent = list.length;
      if (!container) return;

      container.innerHTML = '';

      // Empty Search Result State
      if (list.length === 0) {
        container.innerHTML = `<div class="empty-state">🔍 No articles found matching your query.</div>`;
        return;
      }

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'showcase-card';
        card.innerHTML = `
          <div class="card-header">
            <span class="tag-pill">${item.category}</span>
            <div class="card-actions">
              <button class="btn-edit">✏️ Edit</button>
              <button class="btn-delete" onclick="removePost(${item.id})">🗑️ Delete</button>
            </div>
          </div>
          <h3 class="card-title">${item.title}</h3>
          <p class="card-desc">${item.description}</p>
        `;
        container.appendChild(card);
      });
    }

    function removePost(id) {
      let current = getSafeStorage();
      current = current.filter(b => b.id !== id);
      localStorage.setItem("my_blog_posts", JSON.stringify(current));
      render(current);
    }

    function openAddModal() {
      document.getElementById('add-modal').style.display = 'flex';
    }

    function closeAddModal() {
      document.getElementById('add-modal').style.display = 'none';
    }

    // Performance Optimization: Debounce Function
    function debounce(func, delay = 250) {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), delay);
      };
    }
  </script>
</body>
</html>
