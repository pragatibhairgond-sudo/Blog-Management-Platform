<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer's Corner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
    }

    /* 1. Top Navigation Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 8%;
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-link:hover, .nav-link.active {
      color: #ffffff;
    }

    .btn-create-nav {
      background: #38bdf8;
      color: #0f172a;
      padding: 8px 20px;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-create-nav:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    /* 2. Full-Width Hero Banner Header */
    .hero-banner {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      text-align: center;
      padding: 55px 20px 50px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hero-banner h1 {
      font-size: 2.3rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .hero-banner p {
      color: #94a3b8;
      font-size: 0.98rem;
    }

    /* 3. Floating Centered Search Bar */
    .search-container {
      display: flex;
      justify-content: center;
      margin-top: -25px;
      margin-bottom: 35px;
      padding: 0 20px;
    }

    .search-box {
      position: relative;
      width: 100%;
      max-width: 620px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 22px 14px 48px;
      border-radius: 40px;
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      background: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: #38bdf8;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.05rem;
      color: #94a3b8;
    }

    /* 4. Main Body Layout */
    .app-content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 30px 50px;
    }

    .section-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
    }

    .total-badge {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    /* 5. Card Grid Layout */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 26px;
      width: 100%;
    }

    .blog-card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, border-color 0.2s;
    }

    .blog-card:hover {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.4);
    }

    /* Card Pattern matching image: Category + Date at top */
    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .category-text {
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .date-text {
      color: #64748b;
      font-size: 0.82rem;
    }

    .card-title {
      color: #ffffff;
      font-size: 1.18rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .card-desc {
      color: #94a3b8;
      font-size: 0.88rem;
      line-height: 1.55;
      margin-bottom: 20px;
    }

    /* Actions placed at card bottom */
    .card-footer {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn-edit {
      background: #6366f1;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-delete {
      background: #f43f5e;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Create Post Modal Popup */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 28px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .modal-content h3 {
      font-size: 1.25rem;
      margin-bottom: 18px;
      color: #ffffff;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.84rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #1e293b;
      color: #ffffff;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-submit {
      background: #38bdf8;
      border: none;
      color: #0f172a;
      padding: 8px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 30px 0;
      color: #64748b;
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <div class="logo">MyBlogApp</div>
    <div class="nav-right">
      <a href="index.html" class="nav-link active">Home</a>
      <button class="btn-create-nav" onclick="toggleModal(true)">+ Create Post</button>
    </div>
  </header>

  <!-- Full Width Hero Banner -->
  <section class="hero-banner">
    <h1>Welcome to My Blog Space</h1>
    <p>Discover articles on Web Development, Design, and Technology.</p>
  </section>

  <!-- Floating Centered Search Bar -->
  <div class="search-container">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search blogs by title, author, or category...">
    </div>
  </div>

  <!-- Main Content Body -->
  <div class="app-content">
    <div class="section-bar">
      <h2 class="section-title">Recent Blog Posts</h2>
      <div class="total-badge">Total Articles: <span id="total-articles">0</span></div>
    </div>

    <main>
      <div id="blog-list" class="blog-grid"></div>
    </main>
  </div>

  <footer>
    <p>© 2026 Developer's Corner • Powered by Node.js & Express</p>
  </footer>

  <!-- Create Post Modal Popup -->
  <div id="create-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>Create New Article</h3>
      <div class="form-group">
        <label>Article Title</label>
        <input type="text" id="post-title" placeholder="e.g. How AI is changing web development in 2026">
      </div>
      <div class="form-group">
        <label>Category</label>
        <input type="text" id="post-category" placeholder="e.g. Web Dev or Technology">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="post-desc" rows="4" placeholder="Write a short summary..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="toggleModal(false)">Cancel</button>
        <button class="btn-submit" onclick="createNewPost()">Publish Article</button>
      </div>
    </div>
  </div>

  <script>
    const defaultArticles = [
      {
        id: 1,
        title: "How AI is changing web development in 2026",
        category: "Web Dev",
        date: "2026-07-24",
        description: "AI tools are no longer optional for developers. From automated code completion to intelligent API design, AI is speeding up full-stack development workflows."
      },
      {
        id: 2,
        title: "Mastering CSS Grid and Modern Layouts",
        category: "CSS Design",
        date: "2026-07-30",
        description: "Designing responsive layouts has never been easier. Combining CSS Flexbox for 1D alignments and CSS Grid for 2D structures gives you complete creative control."
      },
      {
        id: 3,
        title: "Building RESTful APIs with Express.js",
        category: "Technology",
        date: "2026-07-31",
        description: "Express.js simplifies route handling and request management in Node.js. By connecting REST APIs to frontend Fetch calls, you create seamless application experiences."
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      initApp();
    });

    function initApp() {
      let stored = localStorage.getItem("my_blog_posts");
      let blogs = stored ? JSON.parse(stored) : defaultArticles;

      if (!stored || blogs.length === 0) {
        localStorage.setItem("my_blog_posts", JSON.stringify(defaultArticles));
        blogs = defaultArticles;
      }

      render(blogs);

      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const query = e.target.value.toLowerCase();
          const filtered = blogs.filter(b => 
            b.title.toLowerCase().includes(query) || 
            b.description.toLowerCase().includes(query) ||
            (b.category && b.category.toLowerCase().includes(query))
          );
          render(filtered);
        });
      }
    }

    function render(list) {
      const container = document.getElementById('blog-list');
      const totalElem = document.getElementById('total-articles');

      if (totalElem) totalElem.textContent = list.length;
      if (!container) return;

      container.innerHTML = '';

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'blog-card';
        card.innerHTML = `
          <div>
            <div class="card-meta">
              <span class="category-text">${item.category || 'Web Dev'}</span>
              <span class="date-text">${item.date || '2026-08-07'}</span>
            </div>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-desc">${item.description}</p>
          </div>
          <div class="card-footer">
            <button class="btn-edit">Edit</button>
            <button class="btn-delete" onclick="removePost(${item.id})">Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function removePost(id) {
      let current = JSON.parse(localStorage.getItem("my_blog_posts")) || defaultArticles;
      current = current.filter(b => b.id !== id);
      localStorage.setItem("my_blog_posts", JSON.stringify(current));
      render(current);
    }

    function toggleModal(show) {
      document.getElementById('create-modal').style.display = show ? 'flex' : 'none';
    }

    function createNewPost() {
      const title = document.getElementById('post-title').value.trim();
      const category = document.getElementById('post-category').value.trim();
      const description = document.getElementById('post-desc').value.trim();

      if (!title || !description) {
        alert("Please enter a title and description.");
        return;
      }

      const today = new Date().toISOString().split('T')[0];
      let current = JSON.parse(localStorage.getItem("my_blog_posts")) || defaultArticles;
      
      const newPost = {
        id: Date.now(),
        title: title,
        category: category || 'Web Dev',
        date: today,
        description: description
      };

      current.unshift(newPost);
      localStorage.setItem("my_blog_posts", JSON.stringify(current));
      
      document.getElementById('post-title').value = '';
      document.getElementById('post-category').value = '';
      document.getElementById('post-desc').value = '';
      toggleModal(false);

      render(current);
    }
  </script>
</body>
</html>
