<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer's Corner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      padding: 0;
      margin: 0;
      min-height: 100vh;
    }

    /* HEADER BACKGROUND CHANGED TO LIGHT BLACK */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 5%;
      background: #161b22; /* Light black / Charcoal */
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: color 0.2s;
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-btn:hover, .nav-btn.active {
      color: #ffffff;
    }

    .btn-create-nav {
      background: linear-gradient(90deg, #6366f1, #3b82f6);
      color: #ffffff;
      padding: 9px 22px;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-create-nav:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    /* Hero Banner */
    .hero {
      text-align: center;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.95));
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 55px 20px 50px;
    }

    .hero h1 {
      font-size: 2.4rem;
      font-weight: 800;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .hero h1 span {
      background: linear-gradient(90deg, #38bdf8, #ec4899);
      background-clip: text;
      -webkit-backdrop-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #94a3b8;
      font-size: 0.98rem;
    }

    /* Floating Search Bar */
    .search-wrapper {
      display: flex;
      justify-content: center;
      margin-top: -24px;
      margin-bottom: 40px;
      padding: 0 20px;
    }

    .search-bar {
      position: relative;
      width: 100%;
      max-width: 650px;
    }

    .search-bar input {
      width: 100%;
      padding: 14px 22px 14px 48px;
      border-radius: 35px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
      transition: border-color 0.2s;
    }

    .search-bar input:focus {
      border-color: #38bdf8;
    }

    .search-bar .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: #94a3b8;
    }

    /* Main Container */
    .app-container {
      max-width: 1450px;
      margin: 0 auto;
      padding: 0 30px 50px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
    }

    .badge {
      background: #6366f1;
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 25px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    /* 3-Column Grid Layout */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      width: 100%;
    }

    .showcase-card {
      width: 100%;
      min-height: 240px; 
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 24px 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, border-color 0.2s;
    }

    .showcase-card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-meta-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tag-pill {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .author-badge {
      color: #e2e8f0;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .post-date {
      color: #64748b;
      font-size: 0.78rem;
    }

    .card-title {
      color: #ffffff;
      font-size: 1.18rem;
      font-weight: 700;
      margin: 8px 0;
      line-height: 1.4;
    }

    .card-desc {
      color: #94a3b8;
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .card-footer {
      display: flex;
      gap: 10px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-edit, .btn-delete {
      border: none;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
    }

    .btn-edit { background: #6366f1; }
    .btn-delete { background: #f43f5e; }

    /* Modal Popup */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
    }

    .modal-content h3 { font-size: 1.3rem; margin-bottom: 18px; color: #ffffff; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.84rem; color: #94a3b8; margin-bottom: 6px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px 14px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(30, 41, 59, 0.6); color: #ffffff; outline: none;
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-cancel { background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: #94a3b8; padding: 8px 16px; border-radius: 10px; cursor: pointer; }
    .btn-submit { background: #6366f1; border: none; color: #ffffff; padding: 8px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; }

    footer {
      text-align: center;
      padding: 30px 0;
      color: #64748b;
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 1024px) {
      .blog-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .blog-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ Developer's Corner</div>
    <nav class="nav-links">
      <a href="index.html" class="nav-btn active">Home</a>
      <button class="btn-create-nav" onclick="toggleModal(true)">+ Create Post</button>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to My <span> Tech Blog </span></h1>
    <p>Discover articles on Web Development, Design, and Technology.</p>
  </section>

  <div class="search-wrapper">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search blogs by title, author, or category...">
    </div>
  </div>

  <div class="app-container">
    <div class="section-header">
      <h2 class="section-title">Recent Blog Posts</h2>
      <div class="badge">Total Articles: <span id="total-articles">0</span></div>
    </div>

    <main>
      <div id="blog-list" class="blog-grid"></div>
    </main>

    <footer>
      <p>© 2026 Developer's Corner • Powered by Node.js & Express</p>
    </footer>
  </div>

  <!-- Create Post Modal -->
  <div id="create-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>Create New Article</h3>
      <div class="form-group">
        <label>Article Title</label>
        <input type="text" id="post-title" placeholder="e.g. Mastering Next.js 15">
      </div>
      <div class="form-group">
        <label>Author Name</label>
        <input type="text" id="post-author" placeholder="e.g. Alex Rivera">
      </div>
      <div class="form-group">
        <label>Category Tag</label>
        <input type="text" id="post-category" placeholder="e.g. #Web_Dev or #AI_ML">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="post-desc" rows="4" placeholder="Write a short summary..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="toggleModal(false)">Cancel</button>
        <button class="btn-submit" onclick="createNewPost()">Publish Article</button>
      </div>
    </div>
  </div>

  <script>
    const defaultArticles = [
      {
        id: 1,
        title: "How AI is changing web development in 2026",
        author: "Alex Rivera",
        category: "#AI_ML",
        date: "2026-07-24",
        description: "AI tools are no longer optional for developers. From automated code completion to intelligent API design, AI is speeding up full-stack workflows."
      },
      {
        id: 2,
        title: "Mastering CSS Grid and Modern Layouts",
        author: "Sarah Chen",
        category: "#CSS_Design",
        date: "2026-07-30",
        description: "Designing responsive layouts has never been easier. Combining CSS Flexbox for 1D alignments and CSS Grid for 2D structures gives you complete creative control."
      },
      {
        id: 3,
        title: "Building RESTful APIs with Express.js",
        author: "David Kim",
        category: "#Technology",
        date: "2026-07-31",
        description: "Express.js simplifies route handling and request management in Node.js. By connecting REST APIs to frontend Fetch calls, you create seamless experiences."
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      initApp();
    });

    function initApp() {
      let stored = localStorage.getItem("my_blog_posts_v5");
      let blogs = stored ? JSON.parse(stored) : defaultArticles;

      if (!stored || blogs.length === 0) {
        localStorage.setItem("my_blog_posts_v5", JSON.stringify(defaultArticles));
        blogs = defaultArticles;
      }

      render(blogs);

      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const query = e.target.value.toLowerCase();
          const filtered = blogs.filter(b => 
            b.title.toLowerCase().includes(query) || 
            b.description.toLowerCase().includes(query) ||
            (b.author && b.author.toLowerCase().includes(query)) ||
            (b.category && b.category.toLowerCase().includes(query))
          );
          render(filtered);
        });
      }
    }

    function render(list) {
      const container = document.getElementById('blog-list');
      const totalElem = document.getElementById('total-articles');

      if (totalElem) totalElem.textContent = list.length;
      if (!container) return;

      container.innerHTML = '';

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'showcase-card';
        card.innerHTML = `
          <div>
            <div class="card-meta">
              <div class="card-meta-left">
                <span class="tag-pill">${item.category || '#Web_Dev'}</span>
                <span class="author-badge">✍️ ${item.author || 'Admin'}</span>
              </div>
              <span class="post-date">${item.date || '2026-08-07'}</span>
            </div>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-desc">${item.description}</p>
          </div>
          <div class="card-footer">
            <button class="btn-edit">✏️ Edit</button>
            <button class="btn-delete" onclick="removePost(${item.id})">🗑️ Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function removePost(id) {
      let current = JSON.parse(localStorage.getItem("my_blog_posts_v5")) || defaultArticles;
      current = current.filter(b => b.id !== id);
      localStorage.setItem("my_blog_posts_v5", JSON.stringify(current));
      render(current);
    }

    function toggleModal(show) {
      document.getElementById('create-modal').style.display = show ? 'flex' : 'none';
    }

    function createNewPost() {
      const title = document.getElementById('post-title').value.trim();
      const author = document.getElementById('post-author').value.trim();
      const category = document.getElementById('post-category').value.trim();
      const description = document.getElementById('post-desc').value.trim();

      if (!title || !description) {
        alert("Please enter a title and description.");
        return;
      }

      const today = new Date().toISOString().split('T')[0];
      let current = JSON.parse(localStorage.getItem("my_blog_posts_v5")) || defaultArticles;
      
      const newPost = {
        id: Date.now(),
        title: title,
        author: author || 'Admin',
        category: category.startsWith('#') ? category : `#${category || 'Web_Dev'}`,
        date: today,
        description: description
      };

      current.unshift(newPost);
      localStorage.setItem("my_blog_posts_v5", JSON.stringify(current));
      
      document.getElementById('post-title').value = '';
      document.getElementById('post-author').value = '';
      document.getElementById('post-category').value = '';
      document.getElementById('post-desc').value = '';
      toggleModal(false);

      render(current);
    }
  </script>
</body>
</html>
