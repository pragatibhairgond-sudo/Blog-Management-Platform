<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer's Corner</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      line-height: 1.5;
    }

    /* Top Navigation */
    header {
      background-color: #1e1b4b;
      color: #ffffff;
      padding: 1rem 1.5rem;
      box-shadow: 0 4px 12px rgba(30, 27, 75, 0.15);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: -0.3px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-nav:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Hero Section - Attractive Indigo Gradient */
    .hero {
      background: linear-gradient(135deg, #312e81 0%, #1e1b4b 60%, #4338ca 100%);
      color: #ffffff;
      text-align: center;
      padding: 4.5rem 2rem 4rem;
      border-radius: 28px;
      margin-bottom: 3rem;
      box-shadow: 0 20px 30px -10px rgba(49, 46, 129, 0.35);
    }

    .hero h1 {
      font-size: 2.35rem;
      font-weight: 800;
      margin-bottom: 0.85rem;
      letter-spacing: -0.5px;
    }

    .hero p {
      color: #c7d2fe;
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .btn-hero {
      background-color: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
    }

    .btn-hero:hover {
      background-color: #d97706;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(217, 119, 6, 0.5);
    }

    /* Posts Section Header */
    .section-title {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 2.25rem;
    }

    /* Posts Grid */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.75rem;
    }

    /* Individual Card */
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 2rem;
      border: 1px solid #e0e7ff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 6px 12px -2px rgba(49, 46, 129, 0.05);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: #a5b4fc;
      box-shadow: 0 16px 28px -6px rgba(49, 46, 129, 0.15);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #3730a3;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-meta {
      color: #64748b;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      font-weight: 500;
    }

    .card-text {
      color: #475569;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      
      line-clamp: 4;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-link {
      color: #4f46e5;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .card-link:hover {
      color: #3730a3;
      text-decoration: underline;
    }

    /* Create Post Form Styles */
    .form-card {
      max-width: 650px;
      margin: 1rem auto;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 28px;
      border: 1px solid #e0e7ff;
      box-shadow: 0 12px 30px -5px rgba(49, 46, 129, 0.08);
    }

    .form-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 0.25rem;
    }

    .form-subtitle {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 0.875rem;
      color: #334155;
      margin-bottom: 0.4rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.75rem;
    }

    .btn-submit {
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.6rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #3730a3;
    }

    .btn-cancel {
      background-color: transparent;
      color: #475569;
      border: 1px solid #cbd5e1;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-cancel:hover {
      background-color: #f1f5f9;
    }

    /* Full Blog Modal Styles */
    .modal-overlay {       
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1.5rem;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 28px;
      max-width: 700px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      animation: modalFadeIn 0.25s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: #f1f5f9;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: bold;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .modal-close:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .modal-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 0.5rem;
      padding-right: 2rem;
    }

    .modal-meta {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
      display: flex;
      gap: 1rem;
      border-bottom: 1px solid #e0e7ff;
      padding-bottom: 1rem;
    }

    .modal-body {
      color: #334155;
      font-size: 1.05rem;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    /* Page Visibility Utility */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="nav-container">
      <div class="logo" onclick="showPage('home')">
        <span>🌐 Developer's Corner</span>
      </div>
      <div class="nav-actions">
        <button class="btn-nav" onclick="showPage('home')">Feed</button>
        <button class="btn-nav" onclick="showPage('create')">+ Create Post</button>
      </div>
    </div>
  </header>

  <div class="container">
    
    <!-- HOME PAGE VIEW -->
    <div id="homeView">
      <section class="hero">
        <h1>🚀 Welcome to My Tech Blog</h1>
        <p>Explore articles on HTML, CSS, JavaScript, and Full Stack Web Development.</p>
        <button class="btn-hero" onclick="showPage('create')">Write a Blog</button>
      </section>

      <h2 class="section-title">Latest Blog Posts</h2>
      <div class="posts-grid" id="postsContainer"></div>
    </div>

    <!-- CREATE POST PAGE VIEW -->
    <div id="createView" class="hidden">
      <div class="form-card">
        <h2 class="form-title">Write a New Blog Post</h2>
        <p class="form-subtitle">Fill in the details below to publish your story.</p>

        <form id="blogForm" onsubmit="handleFormSubmit(event)">
          <div class="form-group">
            <label for="title">Blog Title *</label>
            <input type="text" id="title" placeholder="e.g. Master Flexbox in 10 Minutes..." required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="author">Author Name *</label>
              <input type="text" id="author" placeholder="e.g. John Doe" required>
            </div>

            <div class="form-group">
              <label for="icon">Choose Icon</label>
              <select id="icon">
                <option value="📘">📘 Book (HTML)</option>
                <option value="🎨">🎨 Palette (CSS)</option>
                <option value="⚡">⚡ Lightning (JS)</option>
                <option value="🌐">🌐 Web (General)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="date">Publish Date</label>
            <input type="text" id="date" placeholder="e.g. July 27, 2026">
          </div>

          <div class="form-group">
            <label for="content">Article Content *</label>
            <textarea id="content" rows="6" placeholder="Write your full blog content here..." required></textarea>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-cancel" onclick="showPage('home')">Cancel</button>
            <button type="submit" class="btn-submit">Publish Post</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <!-- FULL BLOG POPUP MODAL -->
  <div id="blogModal" class="modal-overlay hidden" onclick="closeModalOnOverlay(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-meta">
        <span id="modalAuthor"></span>
        <span id="modalDate"></span>
      </div>
      <div class="modal-body" id="modalContent"></div>
    </div>
  </div>

  <script>
    // Blog Data Array with Authors included
    const posts = [
      {
        id: 1,
        title: 'Getting Started with HTML',
        author: 'Alex Rivera',
        icon: '📘',
        date: 'July 24, 2026',
        content: 'Learn the basics of HTML including headings, paragraphs, links, images, lists and semantic tags. HTML provides the structural foundation for every web page built on the internet today.'
      },
      {
        id: 2,
        title: 'Why CSS is Important',
        author: 'Sophia Chen',
        icon: '🎨',
        date: 'July 22, 2026',
        content: 'CSS makes your website beautiful using colors, layouts, Flexbox, Grid and responsive design. Without CSS, web pages would look like plain text documents without hierarchy or modern formatting.'
      },
      {
        id: 3,
        title: 'JavaScript Essentials',
        author: 'Michael Vance',
        icon: '⚡',
        date: 'July 20, 2026',
        content: 'Make websites interactive using DOM events, functions and form validation. JavaScript allows you to build real-time dynamic applications directly inside web browsers.'
      }
    ];

    // Page Switching Handler
    function showPage(pageName) {
      const homeView = document.getElementById('homeView');
      const createView = document.getElementById('createView');

      if (pageName === 'home') {
        homeView.classList.remove('hidden');
        createView.classList.add('hidden');
      } else {
        homeView.classList.add('hidden');
        createView.classList.remove('hidden');
      }
    }

    // Render Posts dynamically
    function renderPosts() {
      const container = document.getElementById('postsContainer');
      container.innerHTML = '';

      posts.forEach(post => {
        const cardHtml = `
          <article class="card">
            <div>
              <h3 class="card-title">
                <span>${post.icon}</span> ${post.title}
              </h3>
              <div class="card-meta">
                <span>👤 ${post.author}</span>
                <span>📅 ${post.date}</span>
              </div>
              <p class="card-text">
                ${post.content}
              </p>
            </div>
            <a class="card-link" onclick="openBlogModal(${post.id})">Read More &rarr;</a>
          </article>
        `;
        container.innerHTML += cardHtml;
      });
    }

    // Handle Creating New Post
    function handleFormSubmit(event) {
      event.preventDefault();

      const title = document.getElementById('title').value;
      const author = document.getElementById('author').value || 'Anonymous';
      const icon = document.getElementById('icon').value;
      const date = document.getElementById('date').value || 'July 27, 2026';
      const content = document.getElementById('content').value;

      const newPost = {
        id: Date.now(),
        title: title,
        author: author,
        icon: icon,
        date: date,
        content: content
      };

      // Add post to top of array
      posts.unshift(newPost);

      // Re-render, clear form, and open home feed
      renderPosts();
      document.getElementById('blogForm').reset();
      alert('New Blog Published Successfully!');
      showPage('home');
    }

    // Modal Control Functions
    function openBlogModal(postId) {
      const post = posts.find(p => p.id === postId);
      if (!post) return;

      document.getElementById('modalTitle').innerText = `${post.icon} ${post.title}`;
      document.getElementById('modalAuthor').innerText = `👤 By ${post.author}`;
      document.getElementById('modalDate').innerText = `📅 ${post.date}`;
      document.getElementById('modalContent').innerText = post.content;

      document.getElementById('blogModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('blogModal').classList.add('hidden');
    }

    function closeModalOnOverlay(event) {
      if (event.target.classList.contains('modal-overlay')) {
        closeModal();
      }
    }

    // Initial load
    renderPosts();
  </script>
</body>
</html>
