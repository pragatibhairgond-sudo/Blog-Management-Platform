<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Blog Post</title>
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <nav>
            <h2>My Blog Site</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="add-blog.html">Add Blog</a></li>
            </ul>
        </nav>
    </header>

    <hr>

        <section>
            <h1>Create a New Blog Post</h1>
            <p>Fill out the details below to submit a new entry.</p>

            <form id="blogForm" action="# "
            method="POST">
                <!-- Post Title -->
                <div>
                    <label for="title">Blog Title:</label><br>
                    <input type="text" id="title" name="title" placeholder="Enter post title" required>
                </div>

                <br>

                <!-- Author Name -->
                <div>
                    <label for="author">Author Name:</label><br>
                    <input type="text" id="author" name="author" placeholder="Your name" required>
                </div>

                <br>

                <!-- Category Selection -->
                <div>
                    <label for="category">Category:</label><br>
                    <select id="category" name="category">
                        <option value="tech">Technology</option>
                        <option value="lifestyle">Lifestyle</option>
                        <option value="education">Education</option>
                    </select>
                </div>

                <br>

                <!-- Post Content -->
                <div>
                    <label for="content">Blog Content:</label><br>
                    <textarea id="content" name="content" rows="8" cols="50" placeholder="Write your story here..." required></textarea>
                </div>

                <br>

                <!-- Action Buttons -->
                <div>
                    <button type="submit">Publish Post</button>
                    <button type="reset">Clear Form</button>
                </div>
            </form>
        </section>
    </main>

    <hr>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My Personal Blog. All rights reserved.</p>
        <p><a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a></p>
    </footer>

<script src="script.js"></script>
</html>
