<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer's Corner • Blog Post</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap');

    :root {
      --bg-dark: #0829b3;
      --card-bg: rgba(22, 70, 222, 0.9);
      --card-border: rgba(255, 255, 255, 0.2);
      
      --btn-edit: #00e676;
      --btn-edit-hover: #00c853;
      --btn-delete: #ff1744;
      --btn-delete-hover: #d50000;
      --accent-cyan: #00f2fe;
    }

    html {
      scroll-behavior: smooth;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 230, 118, 0.15) 0px, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255, 23, 68, 0.15) 0px, transparent 40%);
    }

    h1, h2, h3, .logo {
      font-family: 'Space Grotesk', sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 8%;
      background: rgba(8, 35, 155, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    nav {
      display: flex;
      gap: 0.8rem;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.65rem 1.4rem;
      border-radius: 100px;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .nav-btn:hover {
      background: #ffffff;
      color: #0829b3;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    main {
      flex: 1;
      max-width: 860px;
      width: 90%;
      margin: 3rem auto;
    }

    .blog-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 3rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .blog-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 1.5rem;
    }

    .blog-title {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.2;
      color: #ffffff;
      margin-bottom: 1.2rem;
    }

    .blog-meta {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.9rem;
      color: #d1d5db;
      padding-bottom: 1.8rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 2rem;
    }

    .blog-meta strong {
      color: #ffffff;
    }

    .blog-body {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #f1f5f9;
      white-space: pre-line;
    }

    .blog-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      padding: 0.65rem 1.4rem;
      border-radius: 100px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .btn-back:hover {
      background: #ffffff;
      color: #0829b3;
    }

    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--card-border);
      color: #d1d5db;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">⚡ Latest Blogs</a>
    <nav>
      <a href="index.html" class="nav-btn">← Back to Articles</a>
    </nav>
  </header>

  <main>
    <article class="blog-container">
      <div>
        <span id="blog-tag" class="blog-tag">#WEB_DEV</span>
      </div>

      <h1 id="blog-title" class="blog-title">Loading Article...</h1>

      <div class="blog-meta">
        <span>By <strong id="blog-author">Loading...</strong></span>
        <span id="blog-date">📅 29 July 2026</span>
        <span id="blog-readtime">⏱️ 1 min read</span>
      </div>

      <div id="blog-body" class="blog-body">
        Fetching blog article content...
      </div>

      <div class="blog-actions">
        <a href="index.html" class="btn-back">← Back to Home Showcase</a>
      </div>
    </article>
  </main>

  <footer>
    <p>© 2026 Developer's Corner • Powered by Node.js & Express</p>
  </footer>

  <script>
    function calculateReadTime(text) {
      const words = text ? text.split(/\s+/).length : 0;
      const minutes = Math.ceil(words / 35);
      return `${minutes} min read`;
    }

    async function loadBlogPost() {
      const urlParams = new URLSearchParams(window.location.search);
      const blogId = urlParams.get('id');

      if (!blogId) {
        document.getElementById('blog-title').innerText = "Article Not Found";
        document.getElementById('blog-body').innerText = "No blog ID was provided in the URL.";
        return;
      }

      try {
        const res = await fetch(`/api/blogs/${blogId}`);
        if (!res.ok) throw new Error("Blog not found");

        const blog = await res.json();

        document.getElementById('blog-title').innerText = blog.title;
        document.getElementById('blog-author').innerText = blog.author;
        document.getElementById('blog-body').innerText = blog.description;
        document.getElementById('blog-date').innerText = `📅 ${blog.date || '29 July 2026'}`;
        document.getElementById('blog-readtime').innerText = `⏱️ ${calculateReadTime(blog.description)}`;
      } catch (err) {
        console.error("Error loading blog:", err);
        document.getElementById('blog-title').innerText = "Article Not Found";
        document.getElementById('blog-body').innerText = "Unable to load the requested article. Please make sure the server is running.";
      }
    }

    window.addEventListener('DOMContentLoaded', loadBlogPost);
  </script>
</body>
</html>
