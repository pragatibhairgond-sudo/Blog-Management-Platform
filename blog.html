<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Management System - Add Blog</title>
  <!-- CHANGED: href="/style.css" -> href="style.css" -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header / Navigation -->
  <header>
    <div class="brand">
      <h2>MyBlog<span>App</span></h2>
    </div>
    <nav>
      <!-- CHANGED: href="/" -> href="index.html" -->
      <a href="index.html" class="nav-link">Home</a>
      <!-- CHANGED: href="/addblog" -> href="addblog.html" -->
      <a href="addblog.html" class="nav-link btn-nav active">+ Create Post</a>
    </nav>
  </header>

  <!-- Main Form Section -->
  <main class="container">
    <div class="form-wrapper">
      <h3>Create New Blog Article</h3>
      <p class="form-subtitle">Fill in the fields below to publish a new article to your blog.</p>

      <form id="blog-form">
        <div class="form-group">
          <label for="title">Blog Title</label>
          <input type="text" id="title" name="title" placeholder="Enter article title..." required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="author">Author Name</label>
            <input type="text" id="author" name="author" placeholder="Your name..." required>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
             <option value="" disabled selected>Select a category...</option>
             <option value="Web Dev">Web Dev</option>
             <option value="CSS Design">CSS Design</option>
             <option value="Technology">Technology</option>
             <option value="General">General</option>
             <option value="Current Affairs">Current Affairs</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="content">Article Body</label>
          <textarea id="content" name="content" rows="7" placeholder="Write your full article content here..." required></textarea>
        </div>

        <div class="form-actions">
          <!-- CHANGED: href="/" -> href="index.html" -->
          <a href="index.html" class="btn-cancel">Cancel</a>
          <button type="submit" class="btn-submit">Publish Article</button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Blog Management System | Developed during Codomax Internship</p>
  </footer>

  <!-- CHANGED: src="/main.js" -> src="main.js" -->
  <script src="main.js"></script>
</body>
</html>
